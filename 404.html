<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 — 页面走丢了 | Kun1983</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#f2efe9">
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/css/style.css">
  <style>
    .notfound {
      position: relative;
      display: flex;
      min-height: 100svh;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg);
    }

    .notfound::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(var(--grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid) 1px, transparent 1px);
      background-size: 96px 96px;
      -webkit-mask-image: linear-gradient(to bottom, #000, transparent 92%);
      mask-image: linear-gradient(to bottom, #000, transparent 92%);
      pointer-events: none;
    }

    .nf-inner {
      position: relative;
      z-index: 1;
      display: flex;
      width: 100%;
      max-width: 1340px;
      flex: 1;
      flex-direction: column;
      margin-inline: auto;
      padding: 28px var(--gutter) 34px;
    }

    .nf-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--line);
      font-family: var(--font-mono);
      font-size: 8px;
      letter-spacing: 0.15em;
      color: var(--muted);
    }

    .nf-top a {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--ink);
    }

    .nf-mark {
      display: grid;
      width: 30px;
      height: 30px;
      place-items: center;
      background: var(--ink);
      color: var(--bg);
      font-family: var(--font-display);
      font-size: 10px;
      font-weight: 900;
    }

    .nf-main {
      display: grid;
      flex: 1;
      grid-template-columns: minmax(0, 1.4fr) minmax(260px, 0.6fr);
      gap: 50px;
      align-items: end;
      padding: clamp(60px, 10vh, 120px) 0 clamp(50px, 8vh, 90px);
    }

    .nf-code {
      color: transparent;
      font-family: var(--font-display);
      font-size: clamp(8rem, 25vw, 22rem);
      font-weight: 900;
      letter-spacing: -0.09em;
      line-height: 0.7;
      -webkit-text-stroke: 1.5px var(--coffee);
    }

    .nf-copy {
      max-width: 420px;
      padding-bottom: 12px;
    }

    .nf-kicker {
      color: var(--gold);
      font-family: var(--font-mono);
      font-size: 8px;
      letter-spacing: 0.16em;
    }

    .nf-copy h1 {
      margin-top: 16px;
      font-size: clamp(2.1rem, 4.3vw, 3.5rem);
      font-weight: 700;
      letter-spacing: -0.05em;
      line-height: 1.1;
    }

    .nf-copy p {
      margin-top: 16px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.9;
    }

    .nf-link {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      margin-top: 30px;
      padding-bottom: 5px;
      border-bottom: 1px solid var(--coffee);
      font-size: 11px;
      letter-spacing: 0.06em;
      transition: gap 0.3s var(--ease), color 0.2s ease;
    }

    .nf-link span {
      color: var(--gold);
    }

    .nf-link:hover {
      gap: 20px;
      color: var(--coffee);
    }

    .nf-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-family: var(--font-mono);
      font-size: 7px;
      letter-spacing: 0.14em;
    }

    @media (max-width: 760px) {
      .nf-main {
        grid-template-columns: 1fr;
        gap: 34px;
        align-items: start;
        padding-top: 60px;
      }

      .nf-code {
        font-size: clamp(8rem, 38vw, 12rem);
      }
    }
  </style>
</head>
<body class="notfound">
  <div class="nf-inner">
    <header class="nf-top">
      <a href="/" aria-label="Kun1983 首页">
        <span class="nf-mark" aria-hidden="true">KS</span>
        <span>KUN1983</span>
      </a>
      <span>ERROR / 404</span>
    </header>

    <main class="nf-main">
      <p class="nf-code" aria-hidden="true">404</p>
      <div class="nf-copy">
        <p class="nf-kicker">PAGE NOT FOUND</p>
        <h1>页面走丢了。</h1>
        <p>你访问的地址不存在，或者页面已经被移动。回到首页，继续逛逛。</p>
        <a class="nf-link" href="/">返回首页 <span aria-hidden="true">↗</span></a>
      </div>
    </main>

    <footer class="nf-foot">
      <span>KUN1983.COM</span>
      <span>PC / SONY / MUSIC</span>
    </footer>
  </div>
</body>
</html>
